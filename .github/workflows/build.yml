name: Build mcMMO-Classic for 1.12.2

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công trên GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven (Skip Tests)
      # Thêm -Dmaven.test.skip=true để bỏ qua lỗi JUnit 4.11
      run: mvn clean package install -Dmaven.test.skip=true

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: mcMMO-Classic-Jar
        path: target/*.jar
